[package]
name = "fake"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
ignore = { version = "0.4", features = ["simd-accel"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "signal"] }
serde_json = "1"
thiserror = "2"
axum = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
